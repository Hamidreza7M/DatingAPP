openapi: 3.1.0
info:
  title: FastLove User API
  version: 1.0.0
  description: Shared, versioned contract for Android, Responsive Web and PWA user clients.
servers:
  - url: https://api.example.com/v1
    description: Replace with the production API host
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Profile
  - name: Discovery
  - name: Social
  - name: Chat
  - name: Dates
  - name: Commerce
  - name: Privacy
  - name: Verification
  - name: Support
paths:
  /health:
    get:
      security: []
      tags: [Auth]
      summary: API health
      responses:
        '200': { description: Service is available }
  /auth/otp:
    post:
      security: []
      tags: [Auth]
      summary: Request a one-time passcode
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string } } }
      responses:
        '202': { description: OTP request accepted }
        '429': { description: Rate limit exceeded }
  /auth/verify:
    post:
      security: []
      tags: [Auth]
      summary: Verify OTP and create user session
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string } } }
      responses:
        '200': { description: Authenticated session }
        '401': { description: Invalid OTP }
  /me:
    get:
      tags: [Profile]
      summary: Get current user profile and membership
      responses:
        '200': { description: Profile and current plan }
    patch:
      tags: [Profile]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdate' }
      responses:
        '200': { description: Updated profile }
  /me/photos:
    post:
      tags: [Profile]
      summary: Upload profile photos to private object storage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { files: { type: array, items: { type: string, format: binary } } } }
      responses:
        '201': { description: Uploaded photo metadata }
  /me/voice-intro:
    put:
      tags: [Profile]
      summary: Upload or replace profile voice introduction
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: Voice introduction metadata }
  /discovery:
    get:
      tags: [Discovery]
      summary: Get personalized discovery candidates
      parameters:
        - in: query
          name: minAge
          schema: { type: integer, minimum: 18 }
        - in: query
          name: maxAge
          schema: { type: integer, maximum: 100 }
        - in: query
          name: maxDistanceKm
          schema: { type: number }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: goal
          schema: { type: string }
        - in: query
          name: verifiedOnly
          schema: { type: boolean }
      responses:
        '200': { description: Candidate profiles }
  /users/{userId}:
    get:
      tags: [Discovery]
      summary: View public user profile
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Public profile }
        '404': { description: User not found }
  /likes:
    get:
      tags: [Social]
      summary: Get sent and received likes
      responses:
        '200': { description: Likes and access tier }
    post:
      tags: [Social]
      summary: Like or pass on a profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId, action], properties: { userId: { type: string }, action: { type: string, enum: [like, pass] } } }
      responses:
        '201': { description: Interaction saved and match state returned }
        '409': { description: Daily limit reached }
  /blocks:
    get:
      tags: [Social]
      summary: List blocked users
      responses:
        '200': { description: Block list }
    post:
      tags: [Social]
      summary: Block a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId], properties: { userId: { type: string } } }
      responses:
        '201': { description: User blocked }
  /blocks/{userId}:
    delete:
      tags: [Social]
      summary: Unblock a user
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '204': { description: User unblocked }
  /chats:
    get:
      tags: [Chat]
      summary: List active conversations
      responses:
        '200': { description: Conversation list }
  /chats/{chatId}/messages:
    get:
      tags: [Chat]
      summary: Get conversation messages
      parameters:
        - in: path
          name: chatId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Messages }
    post:
      tags: [Chat]
      summary: Send text, image or voice message
      parameters:
        - in: path
          name: chatId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                type: { type: string, enum: [text, image, voice] }
                text: { type: string }
                file: { type: string, format: binary }
      responses:
        '201': { description: Message accepted }
  /dates:
    get:
      tags: [Dates]
      summary: List scheduled date proposals
      responses:
        '200': { description: Date proposals }
    post:
      tags: [Dates]
      summary: Propose a date with optional map coordinates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DateProposalInput' }
      responses:
        '201': { description: Proposal created }
  /dates/{dateId}:
    patch:
      tags: [Dates]
      summary: Accept, decline or cancel a date proposal
      parameters:
        - in: path
          name: dateId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [accepted, declined, cancelled] } } }
      responses:
        '200': { description: Date status updated }
  /map/nearby:
    get:
      tags: [Discovery]
      summary: Get consenting nearby profiles
      parameters:
        - in: query
          name: latitude
          required: true
          schema: { type: number }
        - in: query
          name: longitude
          required: true
          schema: { type: number }
        - in: query
          name: radiusKm
          schema: { type: number, default: 50 }
      responses:
        '200': { description: Nearby profiles; only users who enabled map visibility are returned }
  /privacy:
    get:
      tags: [Privacy]
      summary: Get privacy settings
      responses:
        '200': { description: Privacy settings }
    patch:
      tags: [Privacy]
      summary: Update privacy and map visibility settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { showOnlineStatus: { type: boolean }, showLastSeen: { type: boolean }, showOnMap: { type: boolean } } }
      responses:
        '200': { description: Settings updated }
  /packages:
    get:
      security: []
      tags: [Commerce]
      summary: List active subscription and direct-message packages
      responses:
        '200': { description: Active packages }
  /purchases:
    get:
      tags: [Commerce]
      summary: List payment history
      responses:
        '200': { description: Payment history }
    post:
      tags: [Commerce]
      summary: Start purchase and return payment gateway redirect
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [packageId], properties: { packageId: { type: string }, idempotencyKey: { type: string } } }
      responses:
        '201': { description: Purchase initialized }
  /verification:
    post:
      tags: [Verification]
      summary: Submit profile verification video
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { video: { type: string, format: binary }, prompt: { type: string } } }
      responses:
        '202': { description: Verification queued }
    get:
      tags: [Verification]
      summary: Get current verification status
      responses:
        '200': { description: Verification status }
  /support/tickets:
    get:
      tags: [Support]
      summary: List current user's support tickets
      responses:
        '200': { description: Ticket list }
    post:
      tags: [Support]
      summary: Create support ticket with optional attachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { subject: { type: string }, category: { type: string }, message: { type: string }, attachment: { type: string, format: binary } } }
      responses:
        '201': { description: Ticket created }
  /support/tickets/{ticketId}/messages:
    post:
      tags: [Support]
      summary: Reply to a support ticket
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [message], properties: { message: { type: string, minLength: 1 } } }
      responses:
        '201': { description: Reply saved }
  /referrals:
    get:
      tags: [Profile]
      summary: Get own referral code and referral summary
      responses:
        '200': { description: Referral code and high-level counts }
  /me:
    delete:
      tags: [Privacy]
      summary: Request account deletion under retention policy
      responses:
        '202': { description: Deletion request accepted }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fastlove_session
  schemas:
    UserProfileUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 48 }
        birthYear: { type: integer, minimum: 1300, maximum: 1408 }
        birthMonth: { type: integer, minimum: 1, maximum: 12 }
        gender: { type: string }
        lookingFor: { type: string }
        goal: { type: string }
        city: { type: string }
        job: { type: string }
        about: { type: string, maxLength: 1000 }
        interests: { type: array, items: { type: string } }
        instagram: { type: string }
        spotify: { type: string }
    DateProposalInput:
      type: object
      required: [personId, place, date, time]
      properties:
        personId: { type: string }
        place: { type: string }
        address: { type: string }
        date: { type: string, format: date }
        time: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
