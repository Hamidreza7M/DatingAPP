openapi: 3.1.0
info:
  title: FastLove Admin API
  version: 1.0.4
  description: >-
    قرارداد اولیه API پنل ادمین. پیاده‌سازی فعلی apps/admin-web یک API دمو دارد؛
    این قرارداد مبنای مهاجرت به سرویس مرکزی چندکلاینتی خواهد بود.
servers:
  - url: /api
security:
  - AdminSession: []
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: fl_admin_session
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        city: { type: string }
        age: { type: integer }
        plan: { type: string, enum: [Free, Pro, VIP] }
        status: { type: string, enum: [active, suspended, deleted] }
        verification: { type: string, enum: [not_verified, pending, verified, rejected] }
    Payment:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        amount: { type: integer, minimum: 0 }
        currency: { type: string }
        status: { type: string, enum: [success, failed, pending] }
        transactionId: { type: string }
        createdAt: { type: string, format: date-time }
    TicketMessage:
      type: object
      required: [author, text, createdAt]
      properties:
        author: { type: string, enum: [user, admin] }
        text: { type: string, minLength: 1, maxLength: 5000 }
        createdAt: { type: string, format: date-time }
    Ticket:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, closed] }
        messages:
          type: array
          items: { $ref: '#/components/schemas/TicketMessage' }
    Package:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [subscription, direct_message] }
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
        messageCount: { type: integer, minimum: 1, maximum: 100000 }
        price: { type: integer, minimum: 1, description: Price in Toman }
        currency: { type: string, example: TOMAN }
        active: { type: boolean }
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200': { description: Service available }
  /auth/login:
    post:
      security: []
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Authenticated; sets HttpOnly session cookie }
        '401': { description: Invalid credentials }
  /auth/logout:
    post:
      summary: Logout admin
      responses:
        '200': { description: Session cleared }
  /auth/me:
    get:
      summary: Current admin session
      responses:
        '200': { description: Current admin }
        '401': { description: Not authenticated }
  /dashboard:
    get:
      summary: BI metrics, trends and recent activity
      responses:
        '200': { description: Dashboard data }
  /users:
    get:
      summary: Search and list users
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: plan
          schema: { type: string }
      responses:
        '200': { description: User list }
  /users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: string }
    get:
      summary: User profile and all related activity records
      responses:
        '200': { description: User details and related resources }
        '404': { description: User not found }
    delete:
      summary: Soft-delete user account
      responses:
        '200': { description: Account deactivated; audit history retained }
  /referrals:
    get:
      summary: List referral-code owners and users registered with each code
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: Referral groups with owner and referred members }
  /payments:
    get:
      summary: Search payments
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200': { description: Payment list }
  /payments/{paymentId}:
    get:
      summary: Payment details
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Payment and associated user }
  /reports:
    get:
      summary: List abuse reports
      responses:
        '200': { description: Report queue }
  /reports/{reportId}:
    patch:
      summary: Approve or reject a report
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected, pending] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Report reviewed }
  /verifications:
    get:
      summary: List video identity verification requests
      responses:
        '200': { description: Verification queue }
  /verifications/{verificationId}:
    patch:
      summary: Approve or reject video verification
      parameters:
        - in: path
          name: verificationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [verified, rejected, pending] }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Verification reviewed }
  /tickets:
    get:
      summary: Search support tickets
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [all, open, closed] }
      responses:
        '200': { description: Ticket inbox }
  /tickets/{ticketId}/reply:
    post:
      summary: Reply to a support ticket
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200': { description: Reply stored }
        '409': { description: Ticket is closed }
  /tickets/{ticketId}/status:
    patch:
      summary: Close or reopen a ticket
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, closed] }
      responses:
        '200': { description: Ticket status changed }
  /likes:
    get:
      summary: List likes
      responses:
        '200': { description: Likes }
  /matches:
    get:
      summary: List matches
      responses:
        '200': { description: Matches }
  /dates:
    get:
      summary: List scheduled dates
      responses:
        '200': { description: Scheduled dates }
  /dates/{dateId}:
    get:
      summary: Read a planned date, its participants and meeting location
      parameters:
        - in: path
          name: dateId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Date details including address and coordinates }
        '404': { description: Date not found }
  /packages:
    get:
      summary: List product packages and prices
      responses:
        '200': { description: Package list }
    post:
      summary: Create a dynamic subscription or direct-message package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, price]
              properties:
                type: { type: string, enum: [subscription, direct_message] }
                name: { type: string, minLength: 1, maxLength: 100 }
                durationDays: { type: integer, minimum: 1, maximum: 3650 }
                messageCount: { type: integer, minimum: 1, maximum: 100000 }
                price: { type: integer, minimum: 1, description: Price in Toman }
      responses:
        '201': { description: Package created and activated }
        '400': { description: Invalid package definition }
  /packages/{packageId}:
    patch:
      summary: Update package price and active state
      parameters:
        - in: path
          name: packageId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                price: { type: integer, minimum: 1, description: Price in Toman }
                durationDays: { type: integer, minimum: 1, maximum: 3650 }
                messageCount: { type: integer, minimum: 1, maximum: 100000 }
                active: { type: boolean }
      responses:
        '200': { description: Package updated }
    delete:
      summary: Permanently remove a package from the active catalog
      parameters:
        - in: path
          name: packageId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Package removed and action audited }
  /audit:
    get:
      summary: Recent admin actions
      responses:
        '200': { description: Audit entries }
