name: Build User Clients
on:
  push:
    paths:
      - 'apps/web-user/**'
      - 'apps/pwa/**'
      - 'packages/user-core/**'
      - 'scripts/build-user.mjs'
      - 'contracts/openapi/user-api.yaml'
      - 'package.json'
  pull_request:
    paths:
      - 'apps/web-user/**'
      - 'apps/pwa/**'
      - 'packages/user-core/**'
      - 'scripts/build-user.mjs'
      - 'contracts/openapi/user-api.yaml'
      - 'package.json'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run user:test
      - run: npm run user:build
      - name: Upload Responsive Web
        uses: actions/upload-artifact@v4
        with:
          name: fastlove-web-user
          path: apps/web-user/dist/
      - name: Upload PWA
        uses: actions/upload-artifact@v4
        with:
          name: fastlove-pwa
          path: apps/pwa/dist/
