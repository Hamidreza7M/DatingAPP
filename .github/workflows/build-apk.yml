name: Android Quality Gate and APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality-gate:
    name: Android tests, quality checks and APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests, lint, coverage and build APK
        working-directory: apps/android
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug jacocoTestReport

      - name: Run Compose UI smoke tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd apps/android && gradle --no-daemon --stacktrace connectedDebugAndroidTest createDebugAndroidTestCoverageReport

      - name: Create build and test summary
        if: always()
        run: python3 apps/android/scripts/write-ci-summary.py

      - name: Publish test, lint and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlove-android-reports-${{ github.run_number }}
          path: |
            apps/android/app/build/test-results/
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/jacoco/
            apps/android/app/build/reports/coverage/
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fastlove-debug-apk-${{ github.run_number }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
