name: Android Quality Gate and APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality-gate:
    name: Android tests, detailed reports and APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-android v4 no longer requests the retired SDK 'tools' package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      # Keep stages independent so one failure does not hide the results of later checks.
      - name: Run JVM unit tests
        id: unit
        continue-on-error: true
        working-directory: apps/android
        run: |
          set -o pipefail
          mkdir -p ci-report/logs
          gradle --no-daemon --stacktrace --console=plain testDebugUnitTest 2>&1 | tee ci-report/logs/unit-tests.log

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        working-directory: apps/android
        run: |
          set -o pipefail
          mkdir -p ci-report/logs
          gradle --no-daemon --stacktrace --console=plain lintDebug 2>&1 | tee ci-report/logs/lint.log

      - name: Build debug APK
        id: apk
        continue-on-error: true
        working-directory: apps/android
        run: |
          set -o pipefail
          mkdir -p ci-report/logs
          gradle --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee ci-report/logs/apk-build.log

      - name: Generate JaCoCo unit-test coverage
        id: coverage
        if: always()
        continue-on-error: true
        working-directory: apps/android
        run: |
          set -o pipefail
          mkdir -p ci-report/logs
          gradle --no-daemon --stacktrace --console=plain jacocoTestReport 2>&1 | tee ci-report/logs/coverage.log

      - name: Enable KVM for Android Emulator
        if: always()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI smoke tests on Android Emulator
        id: ui
        if: always()
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # API 34 is sufficient for this app (compile/target SDK remain 35) and
          # is generally more reliable on hosted Linux runners than API 35 images.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          script: |
            set -Eeuo pipefail
            cd apps/android
            mkdir -p ci-report/logs

            # Run only the instrumentation tests in the UI gate. Unit-test
            # coverage is already generated in the separate COVERAGE stage.
            # Keep the test exit code while collecting emulator diagnostics.
            set +e
            gradle --no-daemon --stacktrace --console=plain connectedDebugAndroidTest 2>&1 | tee ci-report/logs/instrumented-ui-tests.log
            ui_status=${PIPESTATUS[0]}
            set -e

            if [ "$ui_status" -ne 0 ]; then
              echo "UI instrumentation tests failed (exit ${ui_status}); collecting emulator diagnostics."
              adb logcat -d -v threadtime > ci-report/logs/ui-logcat-on-failure.log 2>&1 || true
              adb shell dumpsys activity activities > ci-report/logs/ui-activities-on-failure.txt 2>&1 || true
              adb shell dumpsys package ir.fastlove.demo > ci-report/logs/ui-package-on-failure.txt 2>&1 || true
              exit "$ui_status"
            fi

      - name: Create detailed build and test report
        id: report
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          APK_OUTCOME: ${{ steps.apk.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 apps/android/scripts/write-ci-summary.py

      - name: Upload detailed test and quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fastlove-android-detailed-report-${{ github.run_number }}
          path: |
            apps/android/ci-report/
            apps/android/app/build/test-results/
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/jacoco/
            apps/android/app/build/reports/coverage/
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/app/build/reports/lint-results-debug.xml
            apps/android/app/build/intermediates/lint_intermediate_text_report/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Android quality gate
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          APK_OUTCOME: ${{ steps.apk.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
        run: |
          failed=0
          for stage in UNIT LINT APK COVERAGE UI; do
            outcome="$(printenv "${stage}_OUTCOME" || true)"
            echo "${stage}: ${outcome:-unknown}"
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Android quality gate failed. See the detailed report artifact and workflow summary."
            exit 1
          fi

      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fastlove-debug-apk-${{ github.run_number }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
