name: Android Build & Test

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run common unit tests
        run: gradle --no-daemon :composeApp:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :composeApp:assembleDebug

      - name: Build release AAB
        run: gradle --no-daemon :composeApp:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fastlove-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: fastlove-release-aab
          path: composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
